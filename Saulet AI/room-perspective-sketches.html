<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Перспективные скетчи комнат</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #d8d8d6;
      color: #111;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: #4d4d4d;
      font-size: 14px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    figure {
      margin: 0;
      background: #fbfaf6;
      border: 1px solid #cfcfca;
      padding: 12px;
    }

    figcaption {
      padding: 8px 2px 0;
      color: #333;
      font-size: 14px;
      font-weight: 700;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,0,0,.025), transparent 18%),
        radial-gradient(circle at 80% 30%, rgba(0,0,0,.02), transparent 20%),
        linear-gradient(90deg, rgba(0,0,0,.018) 1px, transparent 1px),
        #fffefb;
      background-size: auto, auto, 42px 42px, auto;
    }

    .main { fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #171717; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
    .light { fill: none; stroke: #666; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .hatch { stroke: #777; stroke-width: .9; stroke-linecap: round; }
    .ghost { fill: none; stroke: #9a9a9a; stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 900px) {
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
